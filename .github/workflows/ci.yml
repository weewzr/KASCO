# Checks for pull requests. This workflow never deploys: GitHub Pages keeps serving docs/ from main
# through its own automatic "pages-build-deployment" workflow, which this file does not touch.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rust engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --release -p saf_engine --locked

  official-values:
    name: Official-value checks (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Only the packages check_official.py imports. The HiGHS cross-checks need the full requirements-dev.txt
      # and a release build of the CLI, and stay a manual step, as the README describes.
      - run: python -m pip install numpy==2.5.5 pandas==3.1.1 openpyxl==3.1.5
      - run: python scripts/check_official.py
      - name: The committed check result must equal the regenerated one
        run: git diff --exit-code -- docs/data/official_check.json

  browser:
    name: Browser checks (64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the browser checks in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check:ui
